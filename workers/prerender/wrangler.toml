name = "vipaspen-prerender"
main = "worker.js"
compatibility_date = "2026-04-11"

routes = [
  { pattern = "www.vipaspen.com/*", zone_name = "vipaspen.com" },
  { pattern = "vipaspen.com/*", zone_name = "vipaspen.com" },
]

[observability]
enabled = true
head_sampling_rate = 0.1

[vars]
# Human/static traffic is proxied here. Points at the Git-built Workers Static
# Assets deployment (the new pipeline), not the legacy Pages project.
UPSTREAM_URL = "https://vip-aspen.silent-sun-bae4.workers.dev"
